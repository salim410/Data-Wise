services:

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3003:3003"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING : "true"


  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d

    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: